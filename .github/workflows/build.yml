name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.android
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good unzip openjdk-17-jdk

    - name: Install Python dependencies
      run: |
        pip install buildozer cython kivy

    - name: Setup Android SDK
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR"
        cd "$SDK_DIR"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
        unzip -q commandlinetools-linux-6514223_latest.zip
        # Принимаем лицензии с явным sdk_root
        yes | tools/bin/sdkmanager --sdk_root="$SDK_DIR" --licenses || true
        # Ставим нужные пакеты
        tools/bin/sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "build-tools;33.0.0" "platforms;android-33"

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: interval-trainer-apk
        path: bin/*.apk
